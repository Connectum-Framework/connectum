name: Dependency Contract

# Proves the framework's dependency contract on the packed candidate, the way a consumer
# installs it: npm, pnpm and Bun each install every @connectum/* tarball into throwaway
# projects OUTSIDE the workspace (whose @bufbuild/protobuf override would hide a
# duplicate). In-range pins must leave exactly one @bufbuild/protobuf /
# @connectrpc/connect / @connectrpc/connect-node among runtime packages, with connect and
# connect-node in lockstep; below-floor pins must fail on npm (ERESOLVE) and warn on pnpm
# and Bun. The scenarios and the expected outcome per manager live only in
# scripts/dependency-contract/check.mjs.
#
# Why a workflow of its own: the release gate installs with pnpm only and runs on three
# Node versions, while the contract does not depend on Node and npm's refusal is the
# outcome that matters; the scaffold matrix is scoped to the CLI and installs published
# packages. One job here covers all three managers.

on:
  pull_request:
    paths:
      - "packages/*/package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "scripts/dependency-contract/**"
      - "scripts/lib/**"
      - ".github/workflows/dependency-contract.yml"
  push:
    branches: [main]
    paths:
      - "packages/*/package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "scripts/dependency-contract/**"
      - "scripts/lib/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: npm / pnpm / Bun
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned to the version the expected outcomes were measured with: Bun's peer
          # warnings differ between releases, and a mutable `latest` would make this
          # verdict depend on the day. Bump deliberately, re-measuring the Bun rows.
          bun-version: "1.4.2"
      - run: pnpm install --frozen-lockfile
      # Builds and packs the workspace itself, then runs every manager x scenario cell.
      - name: Check the dependency contract
        run: pnpm dependency-contract:check
