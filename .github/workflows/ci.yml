name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job caps its runtime with timeout-minutes. Jobs finish in about two
# minutes; without a cap a hung test (e.g. an HTTP/2 connection that never
# closes) holds the runner for GitHub's 6-hour default before failing.
jobs:
  # ── Lint, Typecheck, Audit (run once on dev Node) ──────────────────────
  quality:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # The TypeDoc config treats every warning as an error: a broken {@link},
      # or a public signature that names a type the docs cannot show. The
      # reference is rendered into a throwaway directory because link validation
      # only runs as part of rendering (`--emit none` would skip it).
      - name: API reference (TypeDoc)
        run: pnpm exec typedoc --out "$RUNNER_TEMP/typedoc/api" --docsRoot "$RUNNER_TEMP/typedoc"

      - name: Lint
        run: pnpm lint

      # `pnpm lint` checks only each package's `src`. This covers the rest of the
      # repository -- release scripts, the release-gate fixture, interop helpers --
      # so the same rules bind code that no package owns.
      - name: Lint (whole repository)
        run: pnpm lint:repo

      # The custom Biome plugins fail silently (they just match nothing) when
      # their include globs or patterns drift; this proves they still fire.
      - name: Validate custom lint rules
        run: pnpm lint:rules

      - name: Validate release workflow contract
        run: pnpm release:contract

  # ── Node.js test matrix ────────────────────────────────────────────────
  test-node:
    name: "Node ${{ matrix.node-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Maintained Node lines run TypeScript directly via native type stripping.
      # esbuild transpilation is covered by the dedicated test-esbuild job below.
      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

  # ── AMQP broker integration (happy path, required) ─────────────────────
  # Runs the events-amqp happy-path integration tests against a real RabbitMQ
  # service container. Recovery scenarios live in the non-blocking job below.
  test-amqp-broker:
    name: AMQP broker integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      rabbitmq:
        # Exact version; keep in step with RABBITMQ_IMAGE in
        # packages/events-amqp/tests/integration/brokerImage.ts.
        image: rabbitmq:4.3.6-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: AMQP happy-path integration tests
        env:
          AMQP_TEST_URL: amqp://guest:guest@localhost:5672
        run: pnpm --filter @connectum/events-amqp test:integration

  # ── Redis/Valkey protocol compatibility (required) ────────────────────
  test-redis-broker:
    name: "Redis protocol (${{ matrix.broker.name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        broker:
          - name: redis-6.2
            image: redis:6.2-alpine
          - name: valkey-9.1.1
            image: valkey/valkey:9.1.1-alpine
    services:
      redis:
        image: ${{ matrix.broker.image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Redis adapter integration tests
        env:
          REDIS_TEST_URL: redis://localhost:6379
        run: pnpm --filter @connectum/events-redis test:integration

  # ── Kafka broker integration (required) ────────────────────────────────
  # Runs the events-kafka integration tests against a real single-node Kafka
  # (KRaft) service container. The suite proves offset commits, redelivery
  # order and restart behaviour, which no mock of KafkaJS can. The broker
  # advertises the mapped host port so the test process on the runner can
  # reach it. The tests skip silently without KAFKA_TEST_URL, so the step
  # asserts that nothing was skipped.
  test-kafka-broker:
    name: Kafka broker integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      kafka:
        image: apache/kafka:4.2.0
        ports:
          - 19094:19094
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:19094,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19094
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19094"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Kafka adapter integration tests
        env:
          KAFKA_TEST_URL: localhost:19094
        run: |
          set -o pipefail
          pnpm --filter @connectum/events-kafka test:integration 2>&1 | tee kafka-integration.log
          # The runner colours the summary on CI; strip the escape codes before matching.
          sed -E 's/\x1b\[[0-9;]*m//g' kafka-integration.log > kafka-integration.plain.log
          if ! grep -Eq '^ℹ skipped 0$' kafka-integration.plain.log; then
            echo "::error::Kafka integration tests were skipped or the summary is missing"
            exit 1
          fi
          if ! grep -Eq '^ℹ pass [1-9][0-9]*$' kafka-integration.plain.log; then
            echo "::error::No Kafka integration test passed"
            exit 1
          fi

  # ── AMQP connection recovery (testcontainers) ──────────────────────────
  # Recovery scenarios crash/drop the broker mid-test via testcontainers
  # (programmatic container control). This is the only suite that proves the
  # adapter reconnects, re-asserts topology and replays subscriptions after a
  # broker outage, so a failing test fails this check; it must never report
  # success regardless of the result.
  test-amqp-recovery:
    name: AMQP recovery (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: AMQP recovery tests (testcontainers)
        env:
          RUN_RECOVERY_TESTS: "1"
        run: pnpm --filter @connectum/events-amqp test:integration

  # ── gRPC protocol interop with external clients (required) ────────────
  # Server Reflection, Health and `connectum proto sync` checked with clients
  # that are not built on Connect: grpcurl, buf curl and grpc_health_probe,
  # pinned in docker/interop-tools. Each suite starts the server in the test
  # process; the clients run in Docker on the host network. See
  # tests/interop/README.md.
  test-protocol-interop:
    name: Protocol interop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build the interop tools image
        run: pnpm interop:tools

      - name: Reflection with grpcurl and buf curl
        run: pnpm --filter @connectum/reflection test:interop

      - name: Health with grpcurl and grpc_health_probe
        run: pnpm --filter @connectum/healthcheck test:interop

      - name: connectum proto sync against grpcurl and buf
        run: pnpm --filter @connectum/cli test:interop

  # ── Bun runtime tests ──────────────────────────────────────────────────
  # Two cells, because they guard different claims. `latest` catches regressions in
  # the runtime we tell people to use. `1.2.6` is the floor the docs publish for
  # HTTP/2 client transports (Bun <= 1.2.5 hangs on the first RPC); without a cell
  # there, nothing would catch a wrong floor or a regression at it.
  #
  # The full `test:bun` suite runs on `latest` only. It does NOT pass on 1.2.6, for
  # reasons unrelated to the floor: `events-redis` and `reflection` have tests that
  # need a newer Bun. Pinning the floor cell to the wire test that actually
  # exercises the claim keeps it honest instead of red.
  test-bun:
    name: Bun (${{ matrix.bun }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bun: [latest, "1.2.6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Bun runtime tests
        if: matrix.bun == 'latest'
        run: pnpm test:bun

      # The documented floor itself: an HTTP/2 client against a plaintext h2c server,
      # asserting the gRPC status arrives in trailers. On Bun <= 1.2.5 this hangs.
      # Runs on both cells so a regression on `latest` is caught by the same check.
      - name: HTTP/2 client floor guard
        run: pnpm --filter @connectum/core run test:bun:h2

  # ── esbuild transpilation tests ────────────────────────────────────────
  test-esbuild:
    name: esbuild transpilation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: esbuild tests
        run: pnpm test:esbuild
