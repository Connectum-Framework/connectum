name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Lint, Typecheck, Audit (run once on dev Node) ──────────────────────
  quality:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "25.2.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  # ── Node.js test matrix ────────────────────────────────────────────────
  test-node:
    name: "Node ${{ matrix.node-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "25.2.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Node 22.18+ and 25.x run TypeScript directly via native type stripping.
      # esbuild transpilation is covered by the dedicated test-esbuild job below.
      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

  # ── AMQP broker integration (happy path, required) ─────────────────────
  # Runs the events-amqp happy-path integration tests against a real RabbitMQ
  # service container. Recovery scenarios live in the non-blocking job below.
  test-amqp-broker:
    name: AMQP broker integration
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "25.2.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: AMQP happy-path integration tests
        env:
          AMQP_TEST_URL: amqp://guest:guest@localhost:5672
        run: pnpm --filter @connectum/events-amqp test:integration

  # ── AMQP connection recovery (testcontainers, non-blocking) ────────────
  # Recovery scenarios crash/drop the broker mid-test via testcontainers
  # (programmatic container control). Non-blocking: broker-restart timing can
  # be environment-sensitive, so a failure here must not gate merges.
  test-amqp-recovery:
    name: AMQP recovery (testcontainers)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "25.2.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: AMQP recovery tests (testcontainers)
        env:
          RUN_RECOVERY_TESTS: "1"
        run: pnpm --filter @connectum/events-amqp test:integration

  # ── Bun runtime tests ──────────────────────────────────────────────────
  # Two cells, because they guard different claims. `latest` catches regressions in
  # the runtime we tell people to use. `1.2.6` is the floor the docs publish for
  # HTTP/2 client transports (Bun <= 1.2.5 hangs on the first RPC); without a cell
  # there, nothing would catch a wrong floor or a regression at it.
  #
  # The full `test:bun` suite runs on `latest` only. It does NOT pass on 1.2.6, for
  # reasons unrelated to the floor: `events-redis` and `reflection` have tests that
  # need a newer Bun. Pinning the floor cell to the wire test that actually
  # exercises the claim keeps it honest instead of red.
  test-bun:
    name: Bun (${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: [latest, "1.2.6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "25.2.0"
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Bun runtime tests
        if: matrix.bun == 'latest'
        run: pnpm test:bun

      # The documented floor itself: an HTTP/2 client against a plaintext h2c server,
      # asserting the gRPC status arrives in trailers. On Bun <= 1.2.5 this hangs.
      # Runs on both cells so a regression on `latest` is caught by the same check.
      - name: HTTP/2 client floor guard
        run: pnpm --filter @connectum/core run test:bun:h2

  # ── esbuild transpilation tests ────────────────────────────────────────
  test-esbuild:
    name: esbuild transpilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "25.2.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: esbuild tests
        run: pnpm test:esbuild
