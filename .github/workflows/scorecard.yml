name: OpenSSF Scorecard

# Supply-chain posture check. Results go to Code Scanning (SARIF) and, from the
# default branch, to the public OpenSSF API that backs the README badge.
#
# The OpenSSF API rejects publication from a workflow that has top-level env or
# defaults, top-level write permissions, id-token: write outside the Scorecard job,
# or any step outside checkout / upload-artifact / upload-sarif / scorecard-action.
# Keep this file inside those limits. It is deliberately not a required check:
# Scorecard's own rules change over time, so a score can move without a commit here.

on:
  schedule:
    # Weekly, off the top of the hour to avoid GitHub's peak scheduling load.
    - cron: "17 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload SARIF to Code Scanning.
      security-events: write
      # Publish results to the OpenSSF API (OIDC token).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep SARIF as a run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to Code Scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
