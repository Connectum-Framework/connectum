name: Parity Gate

# Release-blocking invariant: every observable behaviour of the in-process
# transport (`@connectum/core` `createLocalTransport` / `Server.client`) must
# structurally match the HTTP/2 transport. This workflow runs the aggregated
# `transportParityTest()` suite on every PR and on `main`.
#
# See:
#   - docs/en/contributing/parity-invariant.md (Behavioural Parity invariant)
#   - docs/en/contributing/parity-coverage.md (covered scenarios)
#   - scripts/parity-suite.sh (aggregated suite runner)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    name: HTTP ↔ in-process parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "25.2.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run parity suite
        run: bash ./scripts/parity-suite.sh
