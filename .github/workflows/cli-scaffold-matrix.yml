name: CLI Scaffold Matrix

# Anti-drift gate for `connectum init` (OpenSpec change cli-scaffolding, task 1.7 / D-9):
# scaffold a project for each named combo, then buf generate -> typecheck -> test, so a
# broken module fragment fails CI. Scaffolded projects install PUBLISHED @connectum/*
# from npm (consumer perspective) and fetch the base via giget from GitHub.
#
# The combination list lives ONLY in scripts/scaffold-check.mjs. This workflow asks for
# it (`--list`) and runs one cell per name (`--combo <name>`), so `pnpm scaffold:check`
# locally and this gate cannot disagree — there is no second list to keep in sync.
# Adding a combination to that file adds a cell here.
#
# NOT covered here (named per the "no silent caps" rule): the tsx Node-exec model; pnpm
# beyond the base and kitchen-sink cells; event adapters other than nats; and
# live-broker event integration (the generated events test is the broker-free
# MemoryAdapter smoke).

# Pull requests trigger this workflow unconditionally, and the `changes` job decides
# whether the cells are needed. A path filter on the trigger would leave the required
# `Scaffold matrix` status absent on every PR that does not touch the CLI, and GitHub
# would wait for it forever.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "scripts/scaffold-check.mjs"
      - "scripts/lib/**"
      - "scripts/scaffold-check-fixtures/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  changes:
    name: scaffold inputs changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # The same paths the workflow used to filter on. A push to main is already
      # path-filtered by the trigger, so it is always relevant here.
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if echo "$files" | grep -Eq '^(packages/cli/|scripts/scaffold-check\.mjs$|scripts/lib/|scripts/scaffold-check-fixtures/|\.github/workflows/cli-scaffold-matrix\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  discover:
    name: discover combinations
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      combos: ${{ steps.list.outputs.combos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      # No install needed: the script answers --list using node builtins only.
      - id: list
        run: echo "combos=$(node scripts/scaffold-check.mjs --list)" >> "$GITHUB_OUTPUT"

  scaffold:
    name: "init ${{ matrix.combo.name }}"
    needs: [changes, discover]
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        combo: ${{ fromJSON(needs.discover.outputs.combos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - if: matrix.combo.needsBun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned, not `latest`: a mutable external release would make this gate's
          # verdict depend on whatever Bun shipped that morning. Bump deliberately.
          bun-version: "1.3.6"
      - name: Install + build the CLI
        run: |
          pnpm install --frozen-lockfile
          # Through turbo so `build:proto` (generated reflection code) runs first.
          pnpm turbo run build --filter @connectum/cli
      # Scaffold -> install -> typecheck (runs buf generate first) -> test.
      # `base-drift` scaffolds from examples@main instead of the pinned tag: a red cell
      # means the pinned base and the live example diverged. Fix the scaffold fragment,
      # then tag examples and bump DEFAULT_BASE_REF — do not bump the tag alone.
      - name: Scaffold and validate
        run: pnpm scaffold:check --combo ${{ matrix.combo.name }}

  # One stable status for branch protection. The cell names carry the combination
  # name and the workflow only runs its cells when scaffold inputs changed, so
  # requiring the cells directly would hang every other PR. `always()` keeps this job
  # running when a cell fails: a skipped job counts as a success to GitHub.
  #
  # `init base-drift` is deliberately not required: it scaffolds from the live
  # examples@main, so its verdict can change without any change in this repository.
  # It stays visible as its own cell and is reported here as a notice.
  scaffold-matrix:
    name: Scaffold matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, discover, scaffold]
    if: ${{ always() }}
    steps:
      - name: Require every deterministic init cell to have succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if [ "$(echo "$NEEDS" | jq -r '.changes.result')" != "success" ]; then
            echo "::error::changes finished as '$(echo "$NEEDS" | jq -r '.changes.result')'"
            exit 1
          fi
          if [ "$(echo "$NEEDS" | jq -r '.changes.outputs.relevant')" != "true" ]; then
            echo "No scaffold inputs changed; the cells were not needed."
            exit 0
          fi
          if [ "$(echo "$NEEDS" | jq -r '.discover.result')" != "success" ]; then
            echo "::error::discover finished as '$(echo "$NEEDS" | jq -r '.discover.result')'"
            exit 1
          fi
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate --jq '.jobs[] | select(.name | startswith("init ")) | [.name, .conclusion] | @tsv')
          echo "$jobs"
          if [ -z "$jobs" ]; then
            echo "::error::no init cell ran"
            exit 1
          fi
          failed=0
          while IFS=$'\t' read -r name conclusion; do
            if [ "$name" = "init base-drift" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "::notice::init base-drift finished as '$conclusion' (not required)"
              fi
              continue
            fi
            if [ "$conclusion" != "success" ]; then
              echo "::error::$name finished as '$conclusion'"
              failed=1
            fi
          done <<< "$jobs"
          exit $failed
