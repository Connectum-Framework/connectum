name: Bug report
description: Report something that does not work as documented.
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Suspected security vulnerability?** Do not file it here. Use the
        [private report form](https://github.com/Connectum-Framework/connectum/security/advisories/new).

        **Do not paste secrets, tokens, credentials or your application's private
        contracts.** Replace them with placeholders and reduce the example to the
        smallest piece that shows the problem.
  - type: input
    id: versions
    attributes:
      label: "@connectum/* package versions"
      description: Name each affected package and its version.
      placeholder: "@connectum/core 1.3.0, @connectum/interceptors 1.3.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      description: Node.js, Bun or another runtime, with its version.
      placeholder: Node.js 24.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps or a short, self-contained code example, with secrets and private data removed.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: proto
    attributes:
      label: Proto contract (only if relevant)
      description: |
        Include a small contract that reproduces the problem, only when the bug depends on it.
        Do not paste your application's private contracts.
      render: protobuf
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Relevant error messages or stack traces, with secrets removed.
      render: text
    validations:
      required: false
