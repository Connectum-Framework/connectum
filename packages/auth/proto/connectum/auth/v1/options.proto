// Proto extensions for declarative authorization configuration.
//
// Allows defining authorization rules directly in .proto files
// using custom method and service options. Runtime reflection via
// getOption()/hasOption() from @bufbuild/protobuf reads these
// options in the interceptor.
//
// proto2 syntax is required for extension definitions (standard
// practice used by buf.validate, Google API, ZITADEL).

syntax = "proto2";

package connectum.auth.v1;

import "google/protobuf/descriptor.proto";

// Authorization requirements for a method or service.
message AuthRequirements {
  // Roles required to access the method (any-of semantics:
  // the user must have at least one of the listed roles).
  repeated string roles = 1;

  // Scopes required to access the method (all-of semantics:
  // the user must have every listed scope).
  repeated string scopes = 2;
}

// Authorization configuration for an RPC method.
message MethodAuth {
  // Skip both authentication and authorization for this method.
  optional bool public = 1;

  // Access requirements (roles/scopes) for this method.
  optional AuthRequirements requires = 2;

  // Override the service-level default_policy for this method.
  // Valid values: "allow", "deny".
  optional string policy = 3;

  // Mark the method as internal (service-to-service). Skips end-user (JWT)
  // authentication, but requires an internal trust marker established by
  // createInternalAuthInterceptor (a per-service trust source). Distinct from
  // `public`: `public` is world-open (no auth at all); `internal` is reachable
  // only by a trusted internal caller. A method is at most one of
  // `public` / `internal` / gated. See ADR-029.
  optional bool internal = 4;

  // Per-object requirements: the caller must be allowed an action on a
  // specific resource named by the request. Every rule must allow, and the
  // rules are checked in declaration order. A rule is an additional gate on
  // top of `requires` and `policy`; it never replaces them. Allowed only on
  // methods whose request is a single message (unary and server-streaming)
  // and not on `public` methods.
  repeated ResourceRequirement resources = 5;
}

// One per-object requirement of a method: which action the caller needs, and
// where in the request message the resource is named.
message ResourceRequirement {
  // The action (verb or relation) in the vocabulary of the authorization
  // engine, for example "read", "update" or "share". Required, non-empty.
  optional string action = 1;

  // Dot-separated path to the string field of the request that holds the
  // resource id, using proto field names (for example "task_id" or
  // "parent.id"). The path may enter a oneof member and may not cross a
  // repeated or map field. Required.
  optional string id_field = 2;

  // Fixed resource type. Set exactly one of `type` and `type_field`.
  optional string type = 3;

  // Dot-separated path to the string field of the request that holds the
  // resource type. Requires a non-empty `types`.
  optional string type_field = 4;

  // The values `type_field` may hold. A request that names another type is
  // rejected as invalid input before any authorization check runs.
  repeated string types = 5;
}

// Default authorization configuration for all methods in a service.
message ServiceAuth {
  // Default policy when no rule matches.
  // Valid values: "allow", "deny".
  optional string default_policy = 1;

  // Default access requirements applied to all methods
  // unless overridden at the method level.
  optional AuthRequirements default_requires = 2;

  // Mark all methods in the service as public
  // (skip authentication and authorization).
  optional bool public = 3;

  // Mark all methods in the service as internal (service-to-service).
  // Skips end-user (JWT) authentication, but requires an internal trust
  // marker established by createInternalAuthInterceptor. Method-level
  // `internal` overrides this. See ADR-029.
  optional bool internal = 4;
}

// Custom option for RPC methods.
// Field number 50100 is in the 50000-99999 range reserved
// for organizational use.
extend google.protobuf.MethodOptions {
  optional MethodAuth method_auth = 50100;
}

// Custom option for services.
// Field number 50101 is in the 50000-99999 range reserved
// for organizational use.
extend google.protobuf.ServiceOptions {
  optional ServiceAuth service_auth = 50101;
}
